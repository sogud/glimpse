<style>:root{color-scheme:light dark;--bg:#fff;--panel:#f4f4f4;--ink:#181818;--muted:#555;--line:#ddd;--accent:#244d70}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.5}a{color:inherit;text-underline-offset:4px}a,summary{transition:background .7s cubic-bezier(.32,.72,0,1),color .7s cubic-bezier(.32,.72,0,1)}a:hover{color:var(--accent)}a:active{transform:translateY(1px)}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}p{max-width:65ch;text-wrap:pretty;color:var(--muted)}h1,h2,h3{text-wrap:balance;font-weight:600;margin:0 0 24px;letter-spacing:-.04em}h1{max-width:680px;font-size:72px;line-height:1;background:linear-gradient(90deg,#000,#666);color:transparent;background-clip:text}h2{font-size:36px;line-height:40px}h3{font-size:24px;line-height:32px}.wrap{max-width:1160px;margin:auto;padding:0 32px}.skip{position:absolute;left:16px;top:-80px;padding:12px;background:var(--bg);z-index:9}.skip:focus{top:16px}.nav{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:24px 0}.brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:600;text-decoration:none}.brand img{width:40px;height:40px}.navlinks{display:flex;gap:24px}.navlinks a,footer a{display:inline-flex;align-items:center;min-height:44px}.hero{padding:80px 0 64px}.hero p{font-size:20px;line-height:28px;max-width:680px}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;margin-bottom:24px}.cta{display:inline-flex;align-items:center;justify-content:center;min-height:48px;border-radius:8px;padding:8px 12px;background:var(--ink);color:var(--bg);font-weight:600;text-decoration:none;margin:16px 0}.cta:hover{background:var(--accent);color:#fff}.note,figcaption{font-size:14px;line-height:20px;color:var(--muted)}section{padding:64px 0}.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}.cols p{margin-bottom:0}.tagline{padding:96px 0;font-size:48px;line-height:1;max-width:680px;font-weight:600;letter-spacing:-.04em;text-wrap:balance}.tagline span{transition:opacity .8s cubic-bezier(.32,.72,0,1)}.js .tagline span{opacity:.35}.js .tagline span.seen{opacity:1}.status{background:var(--panel);padding:40px;border-radius:24px}.statusgrid{display:grid;grid-template-columns:1fr 1fr;gap:40px}.status li{margin:12px 0;color:var(--muted)}details{padding:16px 0;border-bottom:1px solid var(--line)}summary{cursor:pointer;min-height:44px;font-weight:600;padding:8px 0}details p{margin:8px 0 16px}.faq{max-width:800px}footer{padding:40px 0;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;color:var(--muted);font-size:14px}footer div{display:flex;gap:24px}.legal{max-width:760px;padding-top:64px;padding-bottom:64px}.legal h1{font-size:48px}.legal h2{font-size:24px;margin-top:40px}@media(prefers-color-scheme:dark){:root{--bg:#181818;--panel:#272727;--ink:#fafafa;--muted:#bbb;--line:#555;--accent:#a7c9ed}h1{background-image:linear-gradient(90deg,#fff,#9b9b9b)}.cta:hover{color:#181818}}@media(max-width:700px){.wrap{padding:0 24px}.hero{padding:48px 0}h1{font-size:48px}h2{font-size:30px;line-height:36px}.cols,.statusgrid{grid-template-columns:1fr;gap:24px}.status{padding:24px}.tagline{font-size:36px;line-height:40px;padding:64px 0}.nav{gap:16px}.navlinks{gap:16px}.brand{font-size:20px}.navlinks a{font-size:14px}section{padding:40px 0}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important;animation:none!important}.js .tagline span{opacity:1}}</style></head>
