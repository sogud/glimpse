<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark"><meta name="robots" content="noindex,follow">
<title>Glimpse · iPhone 相册整理</title>
<meta name="description" content="开发中的 iPhone 相册整理 App。逐张浏览，滑动清理，整理到相册。">
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=4"><script src="site.js?v=4" defer></script>
</head>
<body class="showcase">
<a class="skip" href="#main">跳至正文</a>
<header class="topbar"><a class="mark" href="./" aria-label="Glimpse 首页"><img src="favicon.svg" width="28" height="28" alt="">Glimpse</a><span>iPhone 相册整理</span><a href="#about" class="development"><i aria-hidden="true"></i>开发中</a></header>
<main id="main">
<div class="masthead"><h1>Glimpse</h1><p>浏览。选择。归入相册。</p></div>
<section class="workbench" aria-label="照片整理交互示意">
<div class="desk-header"><span>试着整理这三张照片</span><span id="counter">1 / 3</span></div>
<div class="desk">
<aside class="queue" aria-label="示例照片队列"><span class="small-label">待整理</span><div class="queue-items">
<div class="mini selected" data-photo="0"><span class="picture sea" role="img" aria-label="海岸示例"></span><span>海边</span></div>
<div class="mini" data-photo="1"><span class="picture mountain" role="img" aria-label="山野示例"></span><span>山野</span></div>
<div class="mini" data-photo="2"><span class="picture coffee" role="img" aria-label="日常示例"></span><span>日常</span></div>
</div></aside>
<div class="photo-stage">
<div class="back-print" aria-hidden="true"></div>
<figure class="print"><div id="current-photo" class="picture sea" role="img" aria-label="松树下的海岸，AI 合成示例"></div><figcaption><span id="photo-name">海边</span><span id="photo-index">01</span></figcaption></figure>
<div class="complete" hidden><span class="complete-symbol" aria-hidden="true">✓</span><h2>这组照片整理好了。</h2><button id="restart" type="button">重新体验</button></div>
</div>
<aside class="destination" aria-label="目标相册"><span class="small-label">归入相册</span><div class="album-cover"><span class="picture sea" aria-hidden="true"></span><span class="album-spine" aria-hidden="true"></span><span class="album-title">旅行</span></div><div class="album-meta"><span>旅行</span><span id="saved-count">0 张</span></div><p>点击“放入相册”<br>或先跳过这一张。</p></aside>
</div>
<div class="controls"><button id="undo" class="quiet" type="button" disabled>撤回</button><div class="primary-controls"><button id="skip" type="button">跳过</button><button id="save" class="solid" type="button">放入相册 <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button></div><span id="feedback" role="status" aria-live="polite">仅在此网页演示</span></div>
<noscript><p class="demo-note">启用 JavaScript 可体验整理示意；以下图片仍可浏览。</p></noscript>
</section>
<div class="caption"><span>AI 合成示例照片 · 网页交互示意，非 App 截图</span><span>不会读取或修改你的照片</span></div>
<section id="about" class="about"><h2>整理 iPhone<br>里的照片。</h2><div><p>逐张浏览，滑动清理，或归入指定相册。</p><p class="status-copy">仍在开发，尚未公开发布。<br>真实图库与真机体验待继续验证。</p></div></section>
</main>
<footer class="site-footer"><span>Glimpse</span><nav aria-label="网站信息"><a href="privacy.html">网站隐私</a><a href="terms.html">使用说明</a></nav></footer>
</body></html>
